[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sfm"
version = "0.2.0"
description = "Secure File Manager: encrypted per-user vault"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42.0",
    "argon2-cffi>=23.1",
]

[project.scripts]
sfm = "sfm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
